# ── Page routes ────────────────────────────────────────────────────────────────

ts_lodge.dashboard:
  path: '/ts-lodge'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeController::dashboard'
    _title: 'TS Lodge – Accueil'
  requirements:
    _permission: 'access ts_lodge'

ts_lodge.users:
  path: '/ts-lodge/usagers'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeController::users'
    _title: 'Liste des usagers'
  requirements:
    _permission: 'access ts_lodge'

ts_lodge.add_user:
  path: '/ts-lodge/usagers/ajouter'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeController::addUser'
    _title: 'Ajouter un usager'
  requirements:
    _permission: 'create ts_lodge_usager'

ts_lodge.edit_user:
  path: '/ts-lodge/usagers/modifier/{id}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeController::editUser'
    _title: 'Modifier un usager'
  requirements:
    _permission: 'edit ts_lodge_usager'
    id: '\d+'

ts_lodge.book_user:
  path: '/ts-lodge/reservation/{userId}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeController::bookUser'
    _title: 'Réservation'
  requirements:
    _permission: 'create ts_lodge_booking'
    userId: '\d+'

ts_lodge.find_couch:
  path: '/ts-lodge/choisir-couchage/{userId}/{bookingId}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeController::findCouch'
    _title: 'Choisir un couchage'
  requirements:
    _permission: 'edit ts_lodge_booking'
    userId: '\d+'
    bookingId: '\d+'

ts_lodge.couches:
  path: '/ts-lodge/couchages'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeController::couches'
    _title: 'Occupation des couchages'
  requirements:
    _permission: 'view ts_lodge_booking'

ts_lodge.programs:
  path: '/ts-lodge/programmes'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeController::programs'
    _title: 'Gestion des programmes'
  requirements:
    _permission: 'view ts_lodge_programme'

ts_lodge.migrate:
  path: '/ts-lodge/migration'
  defaults:
    _form:  '\Drupal\ts_lodge\Form\TsLodgeMigrateForm'
    _title: 'Importer les données localStorage'
  requirements:
    _permission: 'administer site configuration'

# ── JSON API endpoints (kept for external/migration use) ───────────────────────

ts_lodge.api.usagers.collection:
  path: '/api/ts-lodge/usagers'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeApiController::usagers'
  methods: [GET, POST]
  requirements:
    _permission: 'access ts_lodge'

ts_lodge.api.usagers.item:
  path: '/api/ts-lodge/usagers/{id}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeApiController::usager'
  methods: [GET, PATCH, DELETE]
  requirements:
    _permission: 'access ts_lodge'

ts_lodge.api.bookings.collection:
  path: '/api/ts-lodge/bookings'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeApiController::bookings'
  methods: [GET, POST]
  requirements:
    _permission: 'access ts_lodge'

ts_lodge.api.bookings.item:
  path: '/api/ts-lodge/bookings/{id}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeApiController::booking'
  methods: [GET, PATCH, DELETE]
  requirements:
    _permission: 'access ts_lodge'

ts_lodge.api.programmes.collection:
  path: '/api/ts-lodge/programmes'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeApiController::programmes'
  methods: [GET, POST]
  requirements:
    _permission: 'access ts_lodge'

ts_lodge.api.programmes.item:
  path: '/api/ts-lodge/programmes/{id}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeApiController::programme'
  methods: [GET, PATCH, DELETE]
  requirements:
    _permission: 'access ts_lodge'

# ── HTMX partial endpoints (return rendered HTML fragments) ───────────────────

ts_lodge.htmx.users_rows:
  path: '/ts-lodge/htmx/usagers-rows'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::usersRows'
  methods: [GET]
  requirements:
    _permission: 'access ts_lodge'

ts_lodge.htmx.create_usager:
  path: '/ts-lodge/htmx/usager'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::createUsager'
  methods: [POST]
  requirements:
    _permission: 'create ts_lodge_usager'

ts_lodge.htmx.usager:
  path: '/ts-lodge/htmx/usager/{id}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::updateUsager'
  methods: [PATCH, DELETE]
  requirements:
    _permission: 'access ts_lodge'
    id: '\d+'

ts_lodge.htmx.create_booking:
  path: '/ts-lodge/htmx/usager/{userId}/booking'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::createBooking'
  methods: [POST]
  requirements:
    _permission: 'create ts_lodge_booking'
    userId: '\d+'

ts_lodge.htmx.booking:
  path: '/ts-lodge/htmx/booking/{id}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::updateBooking'
  methods: [PATCH, DELETE]
  requirements:
    _permission: 'access ts_lodge'
    id: '\d+'

ts_lodge.htmx.programmes_rows:
  path: '/ts-lodge/htmx/programmes-rows'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::programmesRows'
  methods: [GET]
  requirements:
    _permission: 'view ts_lodge_programme'

ts_lodge.htmx.programme_form:
  path: '/ts-lodge/htmx/programme-form'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::programmeForm'
    id: ~
  methods: [GET]
  requirements:
    _permission: 'access ts_lodge'

ts_lodge.htmx.programme_form_edit:
  path: '/ts-lodge/htmx/programme-form/{id}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::programmeForm'
  methods: [GET]
  requirements:
    _permission: 'access ts_lodge'
    id: '\d+'

ts_lodge.htmx.create_programme:
  path: '/ts-lodge/htmx/programme'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::createProgramme'
  methods: [POST]
  requirements:
    _permission: 'create ts_lodge_programme'

ts_lodge.htmx.programme:
  path: '/ts-lodge/htmx/programme/{id}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::updateProgramme'
  methods: [PATCH, DELETE]
  requirements:
    _permission: 'access ts_lodge'
    id: '\d+'

ts_lodge.htmx.couches_content:
  path: '/ts-lodge/htmx/couchages'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::couchesContent'
  methods: [GET]
  requirements:
    _permission: 'view ts_lodge_booking'

ts_lodge.htmx.find_couch_buttons:
  path: '/ts-lodge/htmx/couchage/{userId}/{bookingId}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::findCouchButtons'
  methods: [GET]
  requirements:
    _permission: 'edit ts_lodge_booking'
    userId: '\d+'
    bookingId: '\d+'

ts_lodge.htmx.assign_couch:
  path: '/ts-lodge/htmx/assigner-couchage/{bookingId}'
  defaults:
    _controller: '\Drupal\ts_lodge\Controller\TsLodgeHtmxController::assignCouch'
  methods: [POST]
  requirements:
    _permission: 'edit ts_lodge_booking'
    bookingId: '\d+'
